<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Brew & Bite | Contact Us</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #fff8f8; color: #4B2E0F; font-family: 'Poppins', sans-serif; overflow-x: hidden; }

    /* --- PREMIUM NAVBAR (Matched to Home) --- */
    .navbar {
      background: #ec6aab;
      padding: 10px 40px;
      position: fixed;
      top: 0; width: 100%; z-index: 2000;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .navbar-brand { color: #fff !important; font-weight: 700; font-size: 1.6rem; display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .navbar-brand img { height: 45px; width: 45px; border-radius: 50%; border: 2px solid white; object-fit: cover; }
    .nav-links { display: flex; list-style: none; margin: 0; gap: 2rem; align-items: center; }
    .nav-links a { color: #fff !important; text-decoration: none; font-weight: 500; transition: 0.3s; }
    .nav-links a:hover { opacity: 0.8; }

    /* Premium notified Cart button */
    .cart-link { background: rgba(255, 255, 255, 0.2); padding: 6px 15px; border-radius: 20px; position: relative; display: flex; align-items: center; }
    .cart-badge { position: absolute; top: -8px; right: -8px; background: white; color: #ec6aab; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 800; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

    /* --- THE ULTIMATE CURVED HEADER (Restored) --- */
    .contact-header {
      background: #ec6aab;
      padding: 160px 20px 100px;
      text-align: center;
      color: white;
      border-radius: 0 0 50% 50% / 0 0 15% 15%; /* Perfect deep curve */
      position: relative;
    }
    .header-logo { width: 140px; height: 140px; border-radius: 50%; border: 5px solid white; margin-bottom: 20px; background: white; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
    .contact-header h1 { font-size: 4rem; font-weight: 800; margin: 0; text-shadow: 0 4px 15px rgba(0,0,0,0.1); }

    /* --- MODERN CONTACT FORM CARD --- */
    .contact-container { margin-top: -60px; padding: 0 20px; position: relative; z-index: 10; }
    .contact-card {
      max-width: 800px; margin: 0 auto; background: white; padding: 50px 40px;
      border-radius: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.08);
      border: 1px solid rgba(236, 106, 171, 0.05);
    }
    .contact-card h2 { color: #ec6aab; font-weight: 800; font-size: 2.5rem; text-align: center; margin-bottom: 10px; }
    .subtitle { text-align: center; color: #7a3a4f; font-weight: 500; font-size: 1.1rem; margin-bottom: 40px; }

    label { font-weight: 700; color: #ec6aab; margin-bottom: 8px; }
    .form-control { border: 2px solid #fff0f6; border-radius: 15px; padding: 12px 18px; margin-bottom: 20px; transition: 0.3s; font-size: 1.05rem; }
    .form-control:focus { border-color: #ec6aab; box-shadow: 0 0 12px rgba(236, 106, 171, 0.1); outline: none; }

    /* Premium Pill Button style */
    button[type="submit"] {
      background: linear-gradient(135deg, #ec6aab 0%, #ff66b2 100%);
      color: white; border: none; width: 100%; padding: 15px; border-radius: 50px;
      font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: 0.3s;
      box-shadow: 0 10px 20px rgba(236, 106, 171, 0.3);
    }
    button[type="submit"]:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(236, 106, 171, 0.4); }

    /* --- FOOTER LOGOS (Synced with About) --- */
    .footer-logos { display: flex; justify-content: center; align-items: center; gap: 40px; margin-top: 60px; }
    .footer-logos img { 
      width: 150px; height: 150px; border-radius: 50%; background: white; 
      border: 5px solid white; box-shadow: 0 8px 20px rgba(0,0,0,0.1); object-fit: contain;
    }

    footer { background: #ec6aab; color: white; text-align: center; padding: 40px; margin-top: 80px; }
    .hamburger { display: none; color: white; font-size: 2rem; cursor: pointer; }
    @media (max-width: 768px) { .nav-links { display: none; } .contact-header h1 { font-size: 2.5rem; } }
    /* Makes the background transparent so the word 'Cart' is shown */
.nav-cart-btn {
  background: transparent !important; 
  color: white !important; 
  border: 2px solid white; 
  padding: 6px 15px !important;
  border-radius: 50px;
  font-weight: 700 !important;
  display: flex;
  align-items: center;
  text-decoration: none;
}

.badge-pill-custom {
  background: white; 
  color: #ec6aab; 
  border-radius: 50%;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  margin-left: 8px;
}
  </style>
</head>
<body>

  <nav class="navbar">
    <a class="navbar-brand" href="index.html">
      <img src="WhatsApp Image 1447-04-18 at 20.58.46.jpeg" alt="Logo">
      Brew & Bite
    </a>
    <div class="hamburger">☰</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact.html">Contact</a></li>
     <li>
  <a href="My Cart.html" class="nav-cart-btn">
    Cart 🛒 <span class="badge-pill-custom" id="navBadge">0</span>
  </a>
</li>
    </ul>
  </nav>

  <header class="contact-header">
    <img src="WhatsApp Image 1447-04-18 at 20.58.46.jpeg" class="header-logo">
    <h1>Get in Touch</h1>
  </header>

  <div class="contact-container">
    <div class="contact-card">
      <h2>Welcome to Brew & Bite</h2>
      <p class="subtitle">Riyadh's favored gathering space. Drop us a message!</p>
      
      <form action="#" method="post">
        <div class="row">
          <div class="col-md-6">
            <label for="name">Your Name</label>
            <input class="form-control" type="text" id="name" name="name" placeholder="Enter your name" required />
          </div>
          <div class="col-md-6">
            <label for="email">Email Address</label>
            <input class="form-control" type="email" id="email" name="email" placeholder="email@example.com" required />
          </div>
        </div>

        <label for="subject">Subject</label>
        <input class="form-control" type="text" id="subject" name="subject" placeholder="How can we help?" />

        <label for="message">Message</label>
        <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>

        <button type="submit">🚀 Send Message</button>
      </form>
    </div>
  </div>

  <footer>
    <div class="container">
      <div class="footer-logos">
        <img src="WhatsApp Image 1447-04-18 at 20.58.46.jpeg" alt="Brew & Bite Logo">
        <img src="images.png" alt="Breast Cancer Awareness Logo"> </div>
      <p style="margin-top: 30px;">© 2026 Brew & Bite - Riyadh, Saudi Arabia. All Rights Reserved.</p>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      gsap.from(".contact-card", {
        y: 60,
        opacity: 0,
        duration: 0.8,
        ease: "back.out(1.5)"
      });
    });
  </script>
  <script>
  function updateNavBadge() {
    const badge = document.getElementById('navBadge');
    if (badge) {
      const cart = JSON.parse(localStorage.getItem('brewbite-cart')) || [];
      // Calculate total quantity of all items
      const totalItems = cart.reduce((sum, item) => sum + (parseInt(item.quantity) || 1), 0);
      badge.textContent = totalItems;
    }
  }

  // Run immediately when the page loads
  document.addEventListener('DOMContentLoaded', updateNavBadge);
</script>
</body>
</html>
